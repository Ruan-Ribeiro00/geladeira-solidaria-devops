# Banco PostgreSQL para rodar a API localmente.
# Suba com:  docker compose up -d
# As credenciais abaixo sao so de desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    container_name: geladeira-postgres
    environment:
      POSTGRES_DB: geladeira
      POSTGRES_USER: ${DB_USERNAME:-geladeira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geladeira_dev}
    ports:
      - "5432:5432"
    volumes:
      - geladeira-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geladeira} -d geladeira"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  geladeira-pgdata:
