<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="setaAz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1a1a1a">Geladeira Solidária Inteligente · Arquitetura de implantação no Azure</text>
  <text x="40" y="76" font-size="15" fill="#555">FIAP Global Solution 2026/2 · CitizenTech · DevOps Tools &amp; Cloud Computing · Ruan Ribeiro (RM 567693, 2TDSPA)</text>

  <!-- ===================== Coluna esquerda: quem usa ===================== -->
  <text x="40" y="132" font-size="14" font-weight="700" fill="#666" letter-spacing="1">QUEM USA</text>

  <rect x="40" y="148" width="300" height="112" rx="10" fill="#F6F6F6" stroke="#9a9a9a" stroke-width="1.5"/>
  <text x="56" y="176" font-size="16" font-weight="700" fill="#1a1a1a">App mobile (Flutter)</text>
  <text x="56" y="200" font-size="13" fill="#444">Doadores registram doações,</text>
  <text x="56" y="218" font-size="13" fill="#444">voluntários veem alertas e o mapa</text>
  <text x="56" y="236" font-size="13" fill="#444">de geladeiras. Login com JWT.</text>

  <rect x="40" y="278" width="300" height="104" rx="10" fill="#F6F6F6" stroke="#9a9a9a" stroke-width="1.5"/>
  <text x="56" y="306" font-size="16" font-weight="700" fill="#1a1a1a">Sensor IoT na geladeira</text>
  <text x="56" y="330" font-size="13" fill="#444">ESP32 + DHT22 + sensor de porta</text>
  <text x="56" y="348" font-size="13" fill="#444">envia temperatura, umidade e porta:</text>
  <text x="56" y="366" font-size="13" fill="#444" font-family="DejaVu Sans Mono, monospace">POST /api/leituras</text>

  <rect x="40" y="400" width="300" height="92" rx="10" fill="#F6F6F6" stroke="#9a9a9a" stroke-width="1.5"/>
  <text x="56" y="428" font-size="16" font-weight="700" fill="#1a1a1a">Navegador (Swagger)</text>
  <text x="56" y="452" font-size="13" fill="#444">Administrador testa e gerencia</text>
  <text x="56" y="470" font-size="13" fill="#444">geladeiras, doações e alertas.</text>

  <!-- ===================== Coluna esquerda: quem implanta ===================== -->
  <text x="40" y="568" font-size="14" font-weight="700" fill="#666" letter-spacing="1">QUEM IMPLANTA</text>

  <rect x="40" y="584" width="300" height="118" rx="10" fill="#F3F0FA" stroke="#6E5494" stroke-width="1.5"/>
  <text x="56" y="612" font-size="16" font-weight="700" fill="#1a1a1a">GitHub</text>
  <text x="56" y="636" font-size="13" fill="#444">Repositório geladeira-solidaria-devops:</text>
  <text x="56" y="654" font-size="13" fill="#444">Dockerfile, docker-compose.yml,</text>
  <text x="56" y="672" font-size="13" fill="#444">código da API e scripts do Azure.</text>
  <text x="56" y="690" font-size="13" fill="#444">O .env com as senhas não vai pro Git.</text>

  <rect x="40" y="720" width="300" height="118" rx="10" fill="#EAF3FC" stroke="#0078D4" stroke-width="1.5"/>
  <text x="56" y="748" font-size="16" font-weight="700" fill="#1a1a1a">Azure Cloud Shell (az CLI)</text>
  <text x="56" y="772" font-size="13" fill="#444" font-family="DejaVu Sans Mono, monospace">bash azure/criar-vm.sh</text>
  <text x="56" y="792" font-size="13" fill="#444">cria grupo, VM, IP e regras de</text>
  <text x="56" y="810" font-size="13" fill="#444">rede; o cloud-init instala o Docker.</text>
  <text x="56" y="828" font-size="13" fill="#444">Depois: ssh azureuser@IP</text>

  <!-- ===================== Azure ===================== -->
  <rect x="400" y="110" width="1160" height="840" rx="14" fill="#F4F9FE" stroke="#0078D4" stroke-width="2"/>
  <text x="424" y="142" font-size="18" font-weight="700" fill="#0078D4">Microsoft Azure · assinatura Azure for Students</text>

  <rect x="424" y="160" width="1112" height="768" rx="12" fill="none" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="444" y="188" font-size="15" font-weight="700" fill="#0b5394">Grupo de recursos rg-geladeira-solidaria</text>
  <text x="444" y="208" font-size="13" fill="#0b5394">região: a primeira permitida pela assinatura (Brazil South se liberada)</text>

  <!-- IP publico -->
  <rect x="448" y="232" width="236" height="78" rx="10" fill="#ffffff" stroke="#0078D4" stroke-width="1.5"/>
  <text x="464" y="260" font-size="15" font-weight="700" fill="#1a1a1a">IP público (Standard)</text>
  <text x="464" y="284" font-size="13" fill="#444">vm-geladeiraPublicIP</text>
  <text x="464" y="300" font-size="12" fill="#666">endereço usado no app e no vídeo</text>

  <!-- NSG -->
  <rect x="448" y="336" width="236" height="150" rx="10" fill="#ffffff" stroke="#C0392B" stroke-width="1.5"/>
  <text x="464" y="364" font-size="15" font-weight="700" fill="#1a1a1a">Firewall (NSG)</text>
  <text x="464" y="384" font-size="13" fill="#444">vm-geladeiraNSG · entrada:</text>
  <rect x="464" y="396" width="204" height="30" rx="6" fill="#FDECEA"/>
  <text x="474" y="416" font-size="13" fill="#1a1a1a" font-family="DejaVu Sans Mono, monospace">22/TCP    SSH</text>
  <rect x="464" y="432" width="204" height="30" rx="6" fill="#FDECEA"/>
  <text x="474" y="452" font-size="13" fill="#1a1a1a" font-family="DejaVu Sans Mono, monospace">8080/TCP  API</text>
  <text x="464" y="478" font-size="12" fill="#666">5432 (banco) não é liberada</text>

  <!-- VNet -->
  <rect x="712" y="228" width="804" height="680" rx="12" fill="#ffffff" stroke="#5B9BD5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="730" y="252" font-size="13" font-weight="700" fill="#2E75B6">Rede virtual vm-geladeiraVNET · sub-rede padrão</text>

  <!-- VM -->
  <rect x="732" y="266" width="764" height="624" rx="12" fill="#FBFCFD" stroke="#333" stroke-width="1.8"/>
  <text x="752" y="296" font-size="17" font-weight="700" fill="#1a1a1a">VM vm-geladeira · Ubuntu 24.04 LTS</text>
  <text x="752" y="318" font-size="13" fill="#444">Standard_B2s (2 vCPU, 4 GB RAM) · disco 30 GB · usuário azureuser · Docker + Compose via cloud-init</text>

  <!-- Rede Docker -->
  <rect x="756" y="340" width="716" height="352" rx="12" fill="#EEF7FE" stroke="#2496ED" stroke-width="1.8"/>
  <text x="776" y="366" font-size="15" font-weight="700" fill="#1D6FB8">Rede Docker geladeira-net (bridge) · docker compose up -d --build</text>

  <!-- Container API -->
  <rect x="780" y="384" width="300" height="290" rx="10" fill="#FFF6EA" stroke="#E07A00" stroke-width="1.8"/>
  <text x="798" y="412" font-size="16" font-weight="700" fill="#1a1a1a">Container geladeira-api</text>
  <text x="798" y="434" font-size="13" fill="#444">imagem geladeira-solidaria-api:1.0</text>
  <text x="798" y="452" font-size="13" fill="#444">(Dockerfile multi-stage: Maven → JRE)</text>
  <line x1="798" y1="464" x2="1062" y2="464" stroke="#F0C48A"/>
  <text x="798" y="486" font-size="13" fill="#1a1a1a">Java 21 · Spring Boot 3.5 · JWT</text>
  <text x="798" y="506" font-size="13" fill="#1a1a1a">usuário appuser (não-root)</text>
  <text x="798" y="526" font-size="13" fill="#1a1a1a">WORKDIR /app · EXPOSE 8080</text>
  <text x="798" y="546" font-size="13" fill="#1a1a1a">healthcheck: /actuator/health</text>
  <text x="798" y="566" font-size="13" fill="#1a1a1a">Flyway cria as tabelas e os dados</text>
  <text x="798" y="586" font-size="13" fill="#1a1a1a">regras: lotação, validade, alertas</text>
  <rect x="798" y="604" width="264" height="54" rx="6" fill="#ffffff" stroke="#F0C48A"/>
  <text x="810" y="626" font-size="12" fill="#444">porta VM 8080 → container 8080</text>
  <text x="810" y="646" font-size="12" fill="#444">restart: unless-stopped</text>

  <!-- Container DB -->
  <rect x="1148" y="384" width="300" height="290" rx="10" fill="#EEF3FA" stroke="#336791" stroke-width="1.8"/>
  <text x="1166" y="412" font-size="16" font-weight="700" fill="#1a1a1a">Container geladeira-db</text>
  <text x="1166" y="434" font-size="13" fill="#444">imagem postgres:16-alpine</text>
  <line x1="1166" y1="448" x2="1430" y2="448" stroke="#A9BFD9"/>
  <text x="1166" y="470" font-size="13" fill="#1a1a1a">banco geladeira, 7 tabelas:</text>
  <text x="1166" y="490" font-size="13" fill="#1a1a1a">geladeira, doacao, doador,</text>
  <text x="1166" y="510" font-size="13" fill="#1a1a1a">categoria, leitura_sensor,</text>
  <text x="1166" y="530" font-size="13" fill="#1a1a1a">alerta, usuario</text>
  <text x="1166" y="556" font-size="13" fill="#1a1a1a">healthcheck: pg_isready</text>
  <rect x="1166" y="604" width="264" height="54" rx="6" fill="#ffffff" stroke="#A9BFD9"/>
  <text x="1178" y="626" font-size="12" fill="#444">porta 5432 só em 127.0.0.1 (VM)</text>
  <text x="1178" y="646" font-size="12" fill="#444">sobe antes da API (depends_on)</text>

  <!-- .env -->
  <rect x="780" y="726" width="300" height="132" rx="10" fill="#FFFDF0" stroke="#B59F00" stroke-width="1.5"/>
  <text x="798" y="754" font-size="15" font-weight="700" fill="#1a1a1a">Arquivo .env (na VM)</text>
  <text x="798" y="778" font-size="13" fill="#444">DB_NAME, DB_USERNAME, DB_PASSWORD,</text>
  <text x="798" y="796" font-size="13" fill="#444">JWT_SECRET, CORS_ALLOWED_ORIGINS</text>
  <text x="798" y="820" font-size="13" fill="#444">vira variável de ambiente dos</text>
  <text x="798" y="838" font-size="13" fill="#444">containers; não vai pro GitHub</text>

  <!-- Volume -->
  <rect x="1148" y="726" width="300" height="132" rx="10" fill="#F1F8EE" stroke="#4E8A3E" stroke-width="1.5"/>
  <text x="1166" y="754" font-size="15" font-weight="700" fill="#1a1a1a">Volume nomeado geladeira-dados</text>
  <text x="1166" y="778" font-size="13" fill="#444">montado em</text>
  <text x="1166" y="796" font-size="13" fill="#444" font-family="DejaVu Sans Mono, monospace">/var/lib/postgresql/data</text>
  <text x="1166" y="820" font-size="13" fill="#444">os dados continuam lá depois de</text>
  <text x="1166" y="838" font-size="13" fill="#444">docker compose down / reboot</text>

  <!-- ===================== Setas ===================== -->
  <!-- Clientes -> IP publico -->
  <path d="M340,204 C390,204 400,262 446,264" fill="none" stroke="#444" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M340,330 C400,330 400,276 446,272" fill="none" stroke="#444" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M340,446 C410,446 404,286 446,280" fill="none" stroke="#444" stroke-width="2" marker-end="url(#seta)"/>
  <text x="40" y="516" font-size="13" fill="#333"><tspan font-weight="700">↑ todos chamam a API:</tspan> HTTP :8080, REST + JWT</text>

  <!-- IP -> NSG -->
  <line x1="566" y1="310" x2="566" y2="334" stroke="#444" stroke-width="2" marker-end="url(#seta)"/>

  <!-- NSG -> container API (8080) -->
  <path d="M684,447 C740,447 740,500 778,500" fill="none" stroke="#E07A00" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="694" y="530" font-size="12" font-weight="700" fill="#E07A00">8080 → 8080</text>

  <!-- API -> DB -->
  <line x1="1080" y1="500" x2="1146" y2="500" stroke="#336791" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="1114" y="490" font-size="12" font-weight="700" fill="#336791" text-anchor="middle">JDBC</text>
  <text x="1114" y="518" font-size="12" fill="#336791" text-anchor="middle">db:5432</text>

  <!-- DB -> Volume -->
  <line x1="1298" y1="674" x2="1298" y2="724" stroke="#4E8A3E" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- .env -> API -->
  <line x1="930" y1="726" x2="930" y2="676" stroke="#B59F00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta)"/>

  <!-- GitHub / SSH -> VM -->
  <line x1="340" y1="640" x2="730" y2="640" stroke="#6E5494" stroke-width="2" marker-end="url(#seta)"/>
  <text x="452" y="630" font-size="12" font-weight="700" fill="#6E5494">ssh :22 · git clone</text>
  <text x="452" y="660" font-size="12" fill="#6E5494">docker compose up -d --build</text>

  <!-- Cloud Shell -> grupo de recursos -->
  <line x1="340" y1="790" x2="422" y2="790" stroke="#0078D4" stroke-width="2" marker-end="url(#setaAz)"/>
  <text x="440" y="794" font-size="12" font-weight="700" fill="#0078D4">az CLI cria tudo</text>

  <!-- Rodape -->
  <text x="40" y="980" font-size="13" fill="#666">Fluxo: o app, o sensor e o navegador chamam o IP público na porta 8080 → o NSG libera → o Docker encaminha para o container da API → a API grava e lê no PostgreSQL pela rede geladeira-net → os dados ficam no volume.</text>
</svg>
